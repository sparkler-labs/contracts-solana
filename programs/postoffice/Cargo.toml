[package]
name = "postoffice"
version = "1.0.0"
description = "PostOffice: encrypted package delivery on Solana (letters + annexes custody)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "postoffice"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"

[dev-dependencies]
